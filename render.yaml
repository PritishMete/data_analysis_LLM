services:
  - type: web
    name: insight-learning
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn insight_learning.api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /v1/health
    envVars:
      - key: INSIGHTFLOW_PRIVACY_MODE
        value: local_only
      - key: LEARNER_ADAPTERS_ENABLED
        value: "true"
      - key: LEARNER_ADAPTER_ROOT
        value: /app/models/adapters
